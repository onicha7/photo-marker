<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直線・数字マーカー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{padding:14px;text-align:center;font-weight:700;font-size:18px}
#wrap{padding:0 10px 18px}
#photoBox{position:relative;width:100%;max-width:900px;margin:auto;background:#222;border-radius:12px;overflow:hidden;min-height:300px;display:flex;align-items:center;justify-content:center}
#canvas{display:block;width:100%;height:auto;touch-action:none}
#placeholder{position:absolute;color:#aaa;text-align:center;pointer-events:none}
.controls{max-width:900px;margin:10px auto 0;background:#202020;border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.label{width:78px;color:#bbb;font-size:14px}
button,input{font:inherit}
button{border:0;border-radius:9px;background:#3a3a3a;color:white;padding:9px 13px;min-width:42px}
button.active{outline:3px solid white;background:#555}
.color{font-size:20px;padding:6px 12px}
#red.active{outline-color:#ff4b4b}
#blue.active{outline-color:#4b8cff}
.slider{flex:1;min-width:150px}
#save{background:#fff;color:#111;font-weight:700}
#photo{display:none}
.small{font-size:12px;color:#999}
</style>
</head>
<body>
<header>直線・数字マーカー</header>
<div id="wrap">
  <div id="photoBox">
    <canvas id="canvas"></canvas>
    <div id="placeholder">「写真を選択」から画像を読み込んでください</div>
  </div>

  <div class="controls">
    <div class="row">
      <button id="choose">📷 写真を選択</button>
      <input id="photo" type="file" accept="image/*">
      <button id="undo">↩ Undo</button>
      <button id="save">保存</button>
    </div>

    <div class="row">
      <span class="label">色</span>
      <button id="red" class="color active">🔴</button>
      <button id="blue" class="color">🔵</button>
    </div>

    <div class="row">
      <span class="label">数字</span>
      <button class="num active" data-num="1">1</button>
      <button class="num" data-num="2">2</button>
      <button class="num" data-num="3">3</button>
      <button class="num" data-num="4">4</button>
      <button class="num" data-num="5">5</button>
      <button id="line">直線</button>
    </div>

    <div class="row">
      <span class="label">数字サイズ</span>
      <input id="numSize" class="slider" type="range" min="20" max="160" value="60">
      <span id="numSizeValue">60</span>
    </div>

    <div class="row">
      <span class="label">線の太さ</span>
      <input id="lineWidth" class="slider" type="range" min="2" max="40" value="10">
      <span id="lineWidthValue">10</span>
    </div>
    <div class="small">数字モード：写真をタップ。直線モード：押して動かして離す。</div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const ph=document.getElementById('placeholder');
let img=null, objects=[];
let color='#ff2020', number=1, mode='number', drawing=false, start=null, preview=null;

function resizeCanvas(){
  if(!img)return;
  const max=1400;
  const s=Math.min(1,max/img.naturalWidth);
  canvas.width=Math.round(img.naturalWidth*s);
  canvas.height=Math.round(img.naturalHeight*s);
  draw();
}
function draw(){
  if(!img)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  for(const o of objects){
    if(o.type==='num'){
      ctx.fillStyle=o.color;
      ctx.font=`700 ${o.size}px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=Math.max(2,o.size/12);
      ctx.strokeStyle='rgba(0,0,0,.55)';
      ctx.strokeText(o.text,o.x,o.y);
      ctx.fillText(o.text,o.x,o.y);
    }else{
      ctx.strokeStyle=o.color;ctx.lineWidth=o.width;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke();
    }
  }
  if(drawing&&start&&preview){
    ctx.strokeStyle=color;ctx.lineWidth=+lineWidth.value;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(preview.x,preview.y);ctx.stroke();
  }
}
function pos(e){
  const r=canvas.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-r.left)*canvas.width/r.width,y:(p.clientY-r.top)*canvas.height/r.height};
}
function pointerDown(e){
  if(!img)return;
  e.preventDefault();
  const p=pos(e);
  if(mode==='number'){
    objects.push({type:'num',text:String(number),x:p.x,y:p.y,color,size:+numSize.value});
    draw();
  }else{
    drawing=true;start=p;preview=p;draw();
  }
}
function pointerMove(e){
  if(!drawing)return;e.preventDefault();preview=pos(e);draw();
}
function pointerUp(e){
  if(!drawing)return;e.preventDefault();
  const p=pos(e);
  objects.push({type:'line',x1:start.x,y1:start.y,x2:p.x,y2:p.y,color,width:+lineWidth.value});
  drawing=false;start=null;preview=null;draw();
}
canvas.addEventListener('mousedown',pointerDown);
canvas.addEventListener('mousemove',pointerMove);
window.addEventListener('mouseup',pointerUp);
canvas.addEventListener('touchstart',pointerDown,{passive:false});
canvas.addEventListener('touchmove',pointerMove,{passive:false});
window.addEventListener('touchend',pointerUp,{passive:false});

choose.onclick=()=>photo.click();
photo.onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f);img=new Image();
  img.onload=()=>{objects=[];ph.style.display='none';resizeCanvas();URL.revokeObjectURL(u)};
  img.src=u;
};
red.onclick=()=>{color='#ff2020';red.classList.add('active');blue.classList.remove('active')};
blue.onclick=()=>{color='#2477ff';blue.classList.add('active');red.classList.remove('active')};
document.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
  number=+b.dataset.num;
  document.querySelectorAll('.num').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  mode='number';line.classList.remove('active');
});
line.onclick=()=>{mode=mode==='line'?'number':'line';line.classList.toggle('active')};
numSize.oninput=()=>{numSizeValue.textContent=numSize.value};
lineWidth.oninput=()=>{lineWidthValue.textContent=lineWidth.value};
undo.onclick=()=>{objects.pop();draw()};
save.onclick=()=>{
  if(!img)return;
  const a=document.createElement('a');
  a.download='marked-photo.png';a.href=canvas.toDataURL('image/png');a.click();
};
</script>
</body>
</html>
